<!doctype html><html lang="en"><head><meta charset="utf-8"><title>OMU — omu.com</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script>window.OMU = window.OMUDesignSystem_04cba0 || {};</script>
<style>html,body{margin:0}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="SiteFooter.jsx"></script>
<script type="text/babel" src="Landing.jsx"></script>
<script type="text/babel" src="ProductPage.jsx"></script>
<script type="text/babel" src="ColorsPage.jsx"></script>
<script type="text/babel">
function App(){
  const [route,setRoute]=React.useState('home');
  const [colorway,setColorway]=React.useState('olive');
  const [added,setAdded]=React.useState(false);
  const go=r=>{setRoute(r);window.scrollTo(0,0);};
  return <div>
    <window.SiteHeader route={route} onNavigate={go}/>
    {route==='home' && <window.Landing onNavigate={go} colorway={colorway} setColorway={setColorway}/>}
    {route==='product' && <window.ProductPage colorway={colorway} setColorway={setColorway} added={added} onAdd={()=>setAdded(true)}/>}
    {route==='colors' && <window.ColorsPage setColorway={setColorway} onNavigate={go}/>}
    <window.SiteFooter/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
